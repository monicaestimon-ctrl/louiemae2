<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Louie Mae | Curated Home, Kids & Lifestyle</title>

  <!-- SEO Meta -->
  <meta name="description"
    content="Louie Mae — a curated lifestyle destination for elevated home décor, modern organic furniture, thoughtfully designed children's clothing, and timeless everyday pieces. Designed with warmth, intention, and lived-in luxury." />
  <meta name="keywords"
    content="Louie Mae, curated home decor, modern organic furniture, children's clothing, lifestyle boutique, rustic luxury, lived-in design, elevated neutrals" />
  <meta name="author" content="Louie Mae" />
  <meta name="theme-color" content="#F5F2EB" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://louiemae.com/" />
  <meta property="og:title" content="Louie Mae | Curated Home, Kids & Lifestyle" />
  <meta property="og:description"
    content="Elevated home décor, modern organic furniture, and thoughtfully designed children's clothing — curated with warmth, intention, and lived-in luxury." />
  <meta property="og:image" content="https://louiemae.com/lm3.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Louie Mae" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Louie Mae | Curated Home, Kids & Lifestyle" />
  <meta name="twitter:description"
    content="Elevated home décor, modern organic furniture, and thoughtfully designed children's clothing — curated with warmth, intention, and lived-in luxury." />
  <meta name="twitter:image" content="https://louiemae.com/lm3.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://louiemae.com/" />
  <link rel="preload" href="/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cormorant-garamond-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body>
  <div id="root">
    <!-- First paint: the home hero, drawn from HTML before the app loads. React replaces it
         with the identical hero (components/HomePage.tsx); keep the two in step. -->
    <section id="lm-shell" class="relative h-screen h-svh w-full overflow-hidden bg-[#d4c9b8]">
      <img sizes="100vw" alt="Interior" fetchpriority="high" class="absolute inset-0 w-full h-full object-cover"
        srcset="/images/opt/brand/lm3-480.webp 480w, /images/opt/brand/lm3-960.webp 960w, /images/opt/brand/lm3-1600.webp 1600w"
        src="/images/opt/brand/lm3-960.webp" />
      <div class="absolute inset-0 bg-black/20 z-10"></div>
      <div class="absolute inset-0 z-20 flex flex-col items-center justify-center text-center px-6">
        <p class="motion-safe:animate-hero-in text-white/90 text-xs md:text-base uppercase tracking-[0.3em] mb-6">Welcome to Louie Mae</p>
        <h2 class="motion-safe:animate-hero-rise font-serif text-[2.75rem] sm:text-5xl md:text-7xl lg:text-8xl text-cream leading-[1.08] mb-10 drop-shadow-lg max-w-5xl text-balance">Live the life you love.<br /><span class="italic">Love the life you live.</span></h2>
        <div class="motion-safe:animate-hero-in [animation-delay:300ms]">
          <a href="/#collection/new" class="relative group overflow-hidden transition-all duration-300 ease-out flex items-center justify-center gap-2 cursor-pointer rounded-md uppercase tracking-[0.2em] font-light border shadow-lg text-white border-white/30 bg-gradient-to-b from-white/10 to-transparent px-8 py-4 md:px-10 md:py-5 text-xs md:text-sm w-auto"><span class="relative z-10 flex items-center gap-2">New Collection</span></a>
        </div>
      </div>
    </section>
    <script>
      // The shell is the home hero only; any other entry route starts blank as before.
      if (location.pathname !== '/' || location.hash.replace('#', '')) document.getElementById('lm-shell').remove();
      else document.documentElement.dataset.shell = 'home';
    </script>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
