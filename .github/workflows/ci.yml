name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Preserve a production run once it starts so a later push cannot cancel a
  # validated main build before its Convex deployment finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Strict Convex type check
        run: npx tsc -p convex/tsconfig.json

      - name: Verify transactional catalog writers
        run: npm run verify:catalog-writers

      - name: Verify append-only ledger and audit tables
        run: npm run verify:append-only

      - name: Verify no secrets or supplier data are tracked
        run: npm run verify:repo-secrets

      - name: Run tests
        run: npm run test:run

      - name: Verify Lighthouse acceptance policy
        run: npm run test:lighthouse-policy

      - name: Build
        run: npm run build

  deploy-convex:
    # Only deploy to Convex on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Convex
        # Frontend quality/build already ran in lint-test-build, and Vercel builds
        # the frontend deployment. Do not spend a second build here.
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Seed v2 configuration (idempotent, adds missing records only)
        run: npx convex run sysConfig:seed '{}'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: v2 identity backfill (idempotent, additive)
        # The production dry run after #235 was reviewed (1 profile, no partners). Only identity
        # rows are committed here; ledger and credit balances move at the payout cutover
        # (docs/production-v2/06 step 7), after which sync-legacy-ledger keeps them in step.
        run: npx convex run v2Migrations:runBackfills '{"commit":true,"only":["identity"]}'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: v2 ledger parity check (read-only)
        run: npx convex run v2Migrations:ledgerParity '{}'
        continue-on-error: true
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
