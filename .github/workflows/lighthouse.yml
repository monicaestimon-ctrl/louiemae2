name: Production Lighthouse evidence

on:
  workflow_dispatch:
    inputs:
      deployment_commit:
        description: Full production commit verified in Vercel
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-lighthouse
  cancel-in-progress: false

jobs:
  public-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - name: Install the versioned Chrome testing binary
        run: node scripts/lighthouse/install-browser.mjs
      - name: Audit every registered public route serially
        run: node scripts/lighthouse/run.mjs
        env:
          AUDIT_BASE_URL: https://www.louiemae.com
          AUDIT_RUNS: '5'
          AUDIT_VERIFY_DEPLOYMENT: 'true'
          AUDIT_DEPLOYMENT_COMMIT: ${{ inputs.deployment_commit }}
      - name: Retain all runs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: artifacts/lighthouse/
          retention-days: 30
          if-no-files-found: warn
